model:
  vocab_size: 50257
  max_seq_len: 1024
  embed_dim: 768
  num_layers: 12
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4.0
  use_rope: true
  dropout: 0.1
  
  # DeepSeek-V2 MLA
  use_mla: true
  kv_lora_rank: 32
  qk_nope_head_dim: 32
  qk_rope_head_dim: 32
  v_head_dim: 64
  q_lora_rank: 96
  
  # DeepSeek-V2 MoE
  use_moe: true
  num_experts: 8
  top_k: 2

training:
  batch_size: 2
  gradient_accumulation_steps: 8
  lr: 0.0003
  weight_decay: 0.1
  max_epochs: 3
  precision: "bf16"
  checkpoint_dir: "checkpoints/"
  seed: 42
  dataset_name: "roneneldan/TinyStories"
  dataset_split: "train"